name: Build Armour HUD

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build mod
        run: |
          unzip -q Armour-HUD-1.21.11-Build-Project.zip
          cd Armour-HUD-v2
          gradle build

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Armour-HUD-JAR
          path: Armour-HUD-v2/build/libs/*.jar
